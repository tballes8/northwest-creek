<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d9488" />

    <!-- Fallback title only — every route renders its own <title>/<meta name="description">/
         <link rel="canonical"> via React 19 native hoisting, which takes precedence.
         No static description/canonical here: they would duplicate (and for canonical,
         contradict) the per-route tags in the rendered DOM Google indexes. -->
    <title>NWC-Analytics — Professional Stock Analysis for Retail Investors</title>

    <!-- Open Graph (defaults). Two things override these:
         (1) In real browsers, React 19 hoists per-route og/twitter tags (see Landing.tsx, BlogPost.tsx).
         (2) For non-JS social scrapers on /blogs/:slug, server.js rewrites this block server-side
             (it keys off the property="og:*"/name="twitter:*" attributes — these HTML comments are
             stripped by the production build, so no marker-based matching is used). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NWC-Analytics" />
    <meta property="og:title" content="NWC-Analytics — Professional Stock Analysis for Retail Investors" />
    <meta property="og:description" content="Real-time market data, technical indicators, DCF valuations, portfolio tracking, and price alerts for retail investors." />
    <meta property="og:image" content="https://nwc-analytics.com/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://nwc-analytics.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NWC-Analytics — Professional Stock Analysis" />
    <meta name="twitter:description" content="Institutional-grade stock analysis tools built for retail investors." />
    <meta name="twitter:image" content="https://nwc-analytics.com/og/default.png" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- One-time credentials (password-reset / email-verify links carry ?token=) must
         never reach a tracker: GA gets the URL with the token removed, and Clarity and
         Cloudflare don't load on such a page. ANY ad pixel added later (Reddit, Google
         Ads, Microsoft UET) must follow the same rule. App.tsx strips it for SPA views. -->
    <script>
      window.__nwcUrlHasToken = /[?&]token=/.test(window.location.search);
      window.__nwcSafeLocation = function () {
        var u = new URL(window.location.href);
        u.searchParams.delete('token');
        return u.toString();
      };
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-69YY52Z36D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-69YY52Z36D', { page_location: window.__nwcSafeLocation() });
    </script>
    <!-- End Google tag -->
    <!-- Cloudflare Web Analytics update-->
    <script>
      if (!window.__nwcUrlHasToken) {
        var cfb = document.createElement('script');
        cfb.defer = true;
        cfb.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        cfb.setAttribute('data-cf-beacon', '{"token": "e08cd47312204be787595ce158d3c8bd"}');
        document.head.appendChild(cfb);
      }
    </script>
    <!-- End Cloudflare Web Analytics -->
    <!-- Clarity tracking code for https://nwc-analytics.com/ (session replay records full URLs).
         Masking is set to Strict in the Clarity dashboard, and the Privacy Policy says all
         text is masked. Don't relax it there without updating PrivacyPolicy.tsx. -->
    <script>
      if (!window.__nwcUrlHasToken) {
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i+"?ref=bwt";
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "wjswdlaj5q");
      }
    </script>
    <!-- End Clarity -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
